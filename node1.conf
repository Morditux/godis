bind 0.0.0.0
port 7369
maxclients 128

appendonly no
appendfilename appendonly.aof

slowlog-log-slower-than 10000
slowlog-max-len 128

announce-host 127.0.0.1
cluster-enable yes
# node1 is the seed: it bootstrap a new cluster
cluster-as-seed yes
raft-listen-address 127.0.0.1:26666
cluster-config-file 7369.conf