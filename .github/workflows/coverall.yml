# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master", "fork_fixes" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    # a real redis instance is required by the replication tests
    # (TestReplicationSlaveSide, TestReplicationFailover dial 127.0.0.1:6379);
    # pin a version whose RDB format is supported by github.com/hdt3213/rdb
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Lint
      run: test -z "$(gofmt -l . | tee /dev/stderr)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -v -coverprofile=profile.cov ./...

    - uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: profile.cov
